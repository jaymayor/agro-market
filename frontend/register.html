<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish - Agro Market</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">
                <div class="logo-icon"><i class="fas fa-leaf"></i></div>
                <span class="logo-text">Agro Market</span>
            </a>
            
            <div class="auth-steps">
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
                <div class="step-dot"></div>
            </div>
            
            <h1>Ro'yxatdan o'tish</h1>
            <p class="auth-subtitle">Foydalanuvchi turini tanlang</p>
            
            <form id="registerForm" class="auth-form">
                <div class="role-selection">
                    <div class="role-card selected" onclick="selectRole('buyer', this)" data-role="buyer">
                        <i class="fas fa-shopping-bag"></i>
                        <h4>Xaridor</h4>
                        <p>Mahsulot sotib olmoqchiman</p>
                    </div>
                    <div class="role-card" onclick="selectRole('seller', this)" data-role="seller">
                        <i class="fas fa-store"></i>
                        <h4>Sotuvchi</h4>
                        <p>Mahsulot sotmoqchiman</p>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="phone">Telefon raqam</label>
                    <div class="input-with-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" placeholder="+998 90 123 45 67" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="username">Ismingiz</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Ismingiz">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Parol</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Kamida 6 ta belgi" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Parolni tasdiqlang</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Parolni qayta kiriting" required>
                    </div>
                </div>
                
                <label class="checkbox-label">
                    <input type="checkbox" required>
                    <span><a href="terms.html" target="_blank">Foydalanish shartlari</a>ga roziman</span>
                </label>
                
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    Ro'yxatdan o'tish
                </button>
            </form>
            
            <p class="auth-footer">
                Akkountingiz bormi? 
                <a href="login.html">Kirish</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
