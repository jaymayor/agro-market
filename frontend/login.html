<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - Agro Market</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">
                <div class="logo-icon"><i class="fas fa-leaf"></i></div>
                <span class="logo-text">Agro Market</span>
            </a>
            
            <h1>Xush kelibsiz!</h1>
            <p class="auth-subtitle">Tizimga kirish uchun ma'lumotlaringizni kiriting</p>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="phone">Telefon raqam</label>
                    <div class="input-with-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" placeholder="+998 77 235 44 11" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Parol</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Parolingiz" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember">
                        <span>Eslab qolish</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Parolni unutdingiz?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    <span>Kirish</span>
                    <i class="fas fa-spinner fa-spin" style="display: none;"></i>
                </button>
            </form>
            
            <div class="auth-divider">
                <span>yoki</span>
            </div>
            
            <div class="auth-social">
                <button class="social-btn telegram" onclick="loginWithTelegram()">
                    <i class="fab fa-telegram"></i>
                    <span>Telegram orqali kirish</span>
                </button>
            </div>
            
            <p class="auth-footer">
                Hali ro'yxatdan o'tmadingizmi? 
                <a href="register.html">Ro'yxatdan o'tish</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
